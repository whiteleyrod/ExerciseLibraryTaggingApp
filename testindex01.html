<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise Tagging Tool - Muscle Map</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f4f4f9; }
        .container { display: flex; gap: 20px; margin-top: 20px; }
        
        /* SVG Styling */
        #AnatomicalMuscleMap { width: 800px; height: auto; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .muscle-group { fill: #e0e0e0; stroke: #777; stroke-width: 1px; cursor: pointer; transition: 0.2s; }
        .muscle-group:hover { fill: #ffaaaa; }
        .active-tag { fill: #4CAF50 !important; } /* Green for selected */
        .body-outline { fill: none; stroke: #333; stroke-width: 2px; pointer-events: none; }
        
        /* Info Panel Styling */
        #info-panel { width: 300px; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .tag-pill { display: inline-block; background: #4CAF50; color: white; padding: 5px 10px; border-radius: 15px; margin: 5px; font-size: 0.9em; }
    </style>
</head>
<body>

    <h1>Exercise Tagging: Muscle Area</h1>
    <p>Click a muscle region to capture the tag for your workbook.</p>

    <div class="container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" id="AnatomicalMuscleMap">
            <text x="200" y="40" font-size="24" font-weight="bold" fill="#333">FRONT VIEW</text>
            <text x="700" y="40" font-size="24" font-weight="bold" fill="#333">BACK VIEW</text>

            <g id="FrontView" transform="translate(50, 60)">
                <g id="Chest" class="muscle-group"><path d="M120,130 C130,120 170,120 180,130 L180,180 C170,190 130,190 120,180 Z" /><path d="M220,130 C230,120 270,120 280,130 L280,180 C270,190 230,190 220,180 Z" /></g>
                <g id="Quadriceps" class="muscle-group"><path d="M130,360 L180,360 L175,480 L135,480 Z" /><path d="M220,360 L270,360 L265,480 L225,480 Z" /></g>
                <g id="Abdominal - central" class="muscle-group"><rect x="180" y="190" width="40" height="130" rx="5" /></g>
                <g id="Shoulder anterior" class="muscle-group"><circle cx="110" cy="130" r="25" /><circle cx="290" cy="130" r="25" /></g>
                <path d="M200,50 L220,60 L230,80 L290,110 L320,130 L330,170 L320,250 L330,350 L310,360 L290,360 L280,550 L260,610 L220,620 L200,600 L180,620 L140,610 L120,550 L110,360 L90,360 L70,350 L80,250 L70,170 L80,130 L110,110 L170,80 L180,60 Z" class="body-outline" />
            </g>

            <g id="BackView" transform="translate(550, 60)">
                <g id="Gluteal - posterior" class="muscle-group"><path d="M130,320 C140,310 170,310 180,320 L180,365 C170,375 130,375 120,360 Z" /><path d="M220,320 C230,310 270,310 280,320 L280,360 C270,375 230,375 220,365 Z" /></g>
                <g id="Hamstrings" class="muscle-group"><path d="M125,370 L175,375 L170,490 L130,480 Z" /><path d="M225,375 L275,370 L270,480 L230,490 Z" /></g>
                <g id="Spinal extensors lower" class="muscle-group"><rect x="180" y="260" width="40" height="60" rx="5" /></g>
                <path d="M200,50 L220,60 L230,80 L290,110 L320,130 L330,170 L320,250 L330,350 L310,360 L290,360 L280,550 L260,610 L220,620 L200,600 L180,620 L140,610 L120,550 L110,360 L90,360 L70,350 L80,250 L70,170 L80,130 L110,110 L170,80 L180,60 Z" class="body-outline" />
            </g>
        </svg>

        <div id="info-panel">
            <h3>Selected Muscle Tags</h3>
            <div id="tag-container">
                <p style="color: #999;">Click map to add tags...</p>
            </div>
            <hr>
            <p><strong>Last Logged ID:</strong> <span id="log-display">None</span></p>
        </div>
    </div>

    <script>
        const map = document.getElementById('AnatomicalMuscleMap');
        const logDisplay = document.getElementById('log-display');
        const tagContainer = document.getElementById('tag-container');
        
        // Use a Set to keep track of active tags (no duplicates)
        const selectedTags = new Set();

        map.addEventListener('click', function(e) {
            // Traverse up to find the group (<g>) containing the path
            const group = e.target.closest('.muscle-group');
            
            if (group) {
                const muscleId = group.id;
                
                // 1. Log to console & UI for verification
                console.log("Captured Tag:", muscleId);
                logDisplay.innerText = muscleId;

                // 2. Toggle selection state
                if (selectedTags.has(muscleId)) {
                    selectedTags.delete(muscleId);
                    group.classList.remove('active-tag');
                } else {
                    selectedTags.add(muscleId);
                    group.classList.add('active-tag');
                }

                // 3. Update the UI "Pills"
                updateTagPills();
            }
        });

        function updateTagPills() {
            if (selectedTags.size === 0) {
                tagContainer.innerHTML = '<p style="color: #999;">Click map to add tags...</p>';
                return;
            }
            
            tagContainer.innerHTML = '';
            selectedTags.forEach(tag => {
                const pill = document.createElement('span');
                pill.className = 'tag-pill';
                pill.innerText = tag;
                tagContainer.appendChild(pill);
            });
        }
    </script>
</body>
</html>
